<section class="reports-page">
  <header class="page-header">
    <div class="title">
      <mat-icon>history</mat-icon>
      <h1>Rapports de combat</h1>
    </div>
  </header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  @if (error()) {
    <div class="error-banner" role="alert">⚠ {{ error() }}</div>
  }

  @if (!loading() && !reports().length) {
    <p class="hint">Aucun rapport pour le moment — les combats de fin de tour apparaîtront ici.</p>
  }

  <div class="report-list">
    @for (report of reports(); track $index) {
      <button
        type="button"
        [class]="'report-card readonly-allow ' + reportTone(report)"
        (click)="openReport(report)"
      >
        <span class="report-line">
          <span class="report-meta">
            <span class="turn">Tour {{ report.turn }}</span>
            <span class="sector">, Secteur {{ report.sectorNumber }}</span>
            <span class="colon">:</span>
          </span>
          <strong class="result">{{ reportResultLabel(report) }}</strong>
          @if (reportOpponentsLabel(report); as opponents) {
            <span class="vs">vs {{ opponents }}</span>
          }
        </span>
        <span class="report-extra">
          <span class="kind-badge">{{ kindLabel(report.kind) }}</span>
          @if (report.capturedBuildings > 0) {
            <span>{{ report.capturedBuildings }} bâtiment(s) capturé(s)</span>
          }
          @if (report.casualties.length) {
            <span>{{ report.casualties.length }} perte(s)</span>
          }
        </span>
        <mat-icon class="chevron">chevron_right</mat-icon>
      </button>
    }
  </div>
</section>
