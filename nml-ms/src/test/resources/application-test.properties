# Base fournie par @AutoConfigureEmbeddedDatabase (EmbeddedPostgresTest) : PostgreSQL 14 embarqué.

spring.flyway.enabled=true

# Un champ d'entité ajouté sans migration fait échouer toute la suite.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.sql.init.mode=never

jwt.secret=ci-jwt-secret-rotated-2026-not-for-production
jwt.pepper=ci-pepper-rotated-2026
