# ====================================================
# Profil DEV uniquement — NE PAS utiliser en production
# Activer avec : --spring.profiles.active=dev
# ====================================================

# Console H2 désactivée même en dev (sécurité)
spring.h2.console.enabled=false

app.cookie.secure=false

# Local development only : garder la session Hibernate ouverte pendant toute la requête
# pour éviter les LazyInitializationException dans les mappers. La production garde
# open-in-view=false (voir application-prod.properties).
spring.jpa.open-in-view=true

# Les secrets DOIVENT être injectés via les variables d'environnement
# JWT_SECRET et JWT_PEPPER. Ne jamais les commiter.
