# ====================================================
# Profil PRODUCTION
# Activer avec : --spring.profiles.active=prod
# ====================================================

# --- Base de données persistante (ex: PostgreSQL) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nmlonline}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# En prod on valide le schéma ; les migrations sont gérées par Flyway
spring.jpa.hibernate.ddl-auto=validate
# baseline-on-migrate : la DB prod existante est marquée V1 sans exécuter V1__baseline.sql ;
# sur une DB vide, V1 s'exécute et crée tout le schéma.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
# ponytail: OSIV activé car les mappers DTO tournent dans les controllers, hors transaction.
# Fix propre : mapper dans les services @Transactional ou JOIN FETCH, endpoint par endpoint.
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# --- Sécurité ---
app.cookie.secure=true

# JWT Configuration - DOIT être injecté via variables d'environnement
jwt.secret=${JWT_SECRET}
jwt.pepper=${JWT_PEPPER}

# Mot de passe du compte admin initial. DOIT être injecté via variable d'environnement.
app.admin.password=${ADMIN_PASSWORD}

# En prod on ne charge rien au démarrage (ni le board, ni lurio/nursek).
# L'admin importe le board (POST /api/admin/boards/*) puis les joueurs via l'API.
app.import-demo-data=false

# Filesystem runtime pour les assets board uploadés par l'admin (PNG + SVG overlay).
# Volume Docker à monter sur /app/static/ ; tout fichier déposé ici est servi par
# Spring via la règle static-locations=file:/app/static/ (renvoie /<filename>).
app.boards.storage-dir=${BOARDS_STORAGE_DIR:/app/static/boards}

# Servir les fichiers statiques Angular
spring.web.resources.static-locations=classpath:/static/,file:/app/static/

# --- Actuator sécurisé ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
