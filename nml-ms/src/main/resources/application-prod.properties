# ====================================================
# Profil PRODUCTION
# Activer avec : --spring.profiles.active=prod
# ====================================================

# --- Base de données persistante (ex: PostgreSQL) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nmlonline}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# En prod on valide le schéma ; les migrations sont gérées par Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- Sécurité ---
app.cookie.secure=true

# JWT Configuration - DOIT être injecté via variables d'environnement
jwt.secret=${JWT_SECRET}
jwt.pepper=${JWT_PEPPER}

# Servir les fichiers statiques Angularspring.web.resources.static-locations=classpath:/static/,file:/app/static/

# --- Actuator sécurisé ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
