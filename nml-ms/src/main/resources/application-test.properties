# ====================================================
# Profil TEST — utilisé par les tests d'intégration
# ====================================================

# Base fournie par @AutoConfigureEmbeddedDatabase (EmbeddedPostgresTest) : PostgreSQL 14 embarqué.

spring.flyway.enabled=true

# Un champ d'entité ajouté sans migration fait échouer toute la suite.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.sql.init.mode=never

app.cookie.secure=false

jwt.secret=test-secret-key-for-ci-at-least-32-chars-long
jwt.pepper=test-pepper-value-for-ci-tests-only
