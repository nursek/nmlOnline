# ====================================================
# Profil TEST — utilisé par les tests d'intégration
# ====================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

app.cookie.secure=false

# Secrets de test uniquement (ne servent qu'en mémoire pendant les tests)
jwt.secret=test-secret-key-for-ci-at-least-32-chars-long
jwt.pepper=test-pepper-value-for-ci-tests-only
