server.port=8080
spring.application.name=nml-ms
logging.level.root=INFO

spring.datasource.url=jdbc:h2:mem:nmlOnline
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=embedded
spring.jpa.show-sql=false
# Flyway désactivé par défaut (H2 dev/test restent sur ddl-auto) ; activé dans application-prod.properties
spring.flyway.enabled=false
# Désactiver Open Session In View pour éviter les requêtes lazy cachées
spring.jpa.open-in-view=false
# Batch fetching global sur les associations lazy : les parcours de graphe
# (Board -> Sector -> army/buildings/..., Unit -> classesSet/unitEquipments,
# MovementOrder -> route/entityIds) coûtent quelques requêtes IN au lieu d'un
# SELECT par collection. Garde-fou N+1 sous OSIV (activé en prod/dev).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Batch des UPDATE (la résolution de tour mute ordres/secteurs/entités en lot).
# ponytail: ceiling = GenerationType.IDENTITY sur toutes les entités, donc les
# INSERTS ne sont jamais batchés par Hibernate ; passer à SEQUENCE (+ Flyway)
# si les imports de masse deviennent lents.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.mvc.problemdetails.enabled=true
# Plafond des pages : sans lui, un size=2000 force le chargement complet de tables entières.
spring.data.web.pageable.max-page-size=500

# Défaut Spring (1 Mo) trop bas pour une carte PNG ; 21 Mo = 2 fichiers de 10 Mo + overhead multipart.
# max-swallow-size : sinon Tomcat coupe la connexion avant que le client lise le 413.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB
server.tomcat.max-swallow-size=21MB

# True en production
app.cookie.secure=true

# JWT Configuration - DOIT être injecté via variables d'environnement
jwt.secret=${JWT_SECRET}
jwt.pepper=${JWT_PEPPER}

# Servir les fichiers statiques Angular depuis /app/static (Docker)
spring.web.resources.static-locations=classpath:/static/,file:/app/static/
