server.port=8080
spring.application.name=nml-ms
logging.level.root=INFO
spring.datasource.url=jdbc:h2:mem:nmlOnline
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

#True in prod env
app.cookie.secure=true

# JWT Configuration - must be injected via environment variables
jwt.secret=${JWT_SECRET}
jwt.pepper=${JWT_PEPPER}

# Limite de taille des fichiers uploadés (sécurité anti-DoS)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Masquer les dÃ©tails d'erreurs en production
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Servir les fichiers statiques Angular depuis /app/static (Docker)
spring.web.resources.static-locations=classpath:/static/,file:/app/static/
