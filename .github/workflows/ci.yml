name: CI — Tests & Lint

on:
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

concurrency:
  # Préfixe littéral : appelé par cd.yml, github.workflow vaudrait le nom de l'appelant et le groupe s'auto-annulerait.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test and package backend
        working-directory: ./nml-ms
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nml-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./nml-ui
        run: npm ci

      - name: Lint
        working-directory: ./nml-ui
        run: npm run lint

      - name: Test
        working-directory: ./nml-ui
        run: npm test -- --ci --coverage

      - name: Production build
        working-directory: ./nml-ui
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: frontend-coverage
          path: ./nml-ui/coverage
          retention-days: 7
