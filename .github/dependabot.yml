version: 2
updates:
  - package-ecosystem: maven
    directory: /nml-ms
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /nml-ui
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular*"
          - "angular-eslint"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
