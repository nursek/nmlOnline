<div class="login-page">
  <div class="login-container">
    <mat-card class="login-card">
      <mat-card-content>
        <!-- Logo et titre -->
        <div class="header">
          <div class="avatar">
            <mat-icon>shield</mat-icon>
          </div>
          <h1 class="title">NML Online</h1>
          <p class="subtitle">Connectez-vous pour conquérir des territoires</p>
        </div>

        <!-- Formulaire -->
        <form (submit)="onSubmit($event)" aria-label="Formulaire de connexion">
          <!-- Erreur -->
          @if (error(); as error) {
            <div class="error-alert" role="alert">
              <mat-icon>error</mat-icon>
              {{ error }}
            </div>
          }

          <!-- Nom d'utilisateur -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nom d'utilisateur</mat-label>
            <input
              matInput
              type="text"
              autocomplete="username"
              [value]="username()"
              (input)="username.set($any($event.target).value)"
            />
            @if (submitted() && usernameError(); as err) {
              <mat-error>{{ err }}</mat-error>
            }
          </mat-form-field>

          <!-- Mot de passe -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mot de passe</mat-label>
            <input
              matInput
              type="password"
              autocomplete="current-password"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
            />
            @if (submitted() && passwordError(); as err) {
              <mat-error>{{ err }}</mat-error>
            }
          </mat-form-field>

          <!-- Se souvenir de moi -->
          <mat-checkbox
            color="primary"
            [checked]="rememberMe()"
            (change)="rememberMe.set($event.checked)"
          >
            Se souvenir de moi (30 jours)
          </mat-checkbox>

          <!-- Bouton de connexion -->
          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="submit-btn"
            [disabled]="(submitted() && invalid()) || loading()"
          >
            @if (loading()) {
              <mat-spinner diameter="20" aria-label="Chargement en cours"></mat-spinner>
              Connexion en cours...
            } @else {
              Se connecter
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
